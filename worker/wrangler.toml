name = "family-board-sync"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "CODES"
id = "3e6dc4a8a19c41cabfb2c65f45240310"

[[durable_objects.bindings]]
name = "BOARD_OBJECTS"
class_name = "FamilyBoardObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FamilyBoardObject"]

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[vars]
ALLOWED_ORIGINS = "https://michaelens.github.io"
ALEXA_SKILL_ID = "amzn1.ask.skill.f4f0cfd5-60c5-458a-b529-cad584c8c294,amzn1.ask.skill.2f5938e8-e54f-4c55-860c-ecc95c1aa431"
PUBLIC_BASE_URL = "https://family-board-sync.michaelens.workers.dev"

# Configure after creating the Alexa skill:
#   npx wrangler secret put ALEXA_CLIENT_ID
#   npx wrangler secret put ALEXA_CLIENT_SECRET
